name: Generate audio

# 手動実行専用：GitHub の Actions タブ →「Generate audio」→ Run workflow
on:
  workflow_dispatch:
    inputs:
      voices:
        description: '作る声（voices.ts の key をカンマ区切り。空欄ですべて）'
        required: false
        default: ''
      limit:
        description: '作る最大ファイル数（試しに少しだけ作るときに。空欄で全部）'
        required: false
        default: ''
      force:
        description: '変更がなくても全部作り直す'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ffmpeg
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
      - name: Generate
        run: node --experimental-strip-types scripts/generate-audio.mjs
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          VOICES: ${{ inputs.voices }}
          LIMIT: ${{ inputs.limit }}
          FORCE: ${{ inputs.force }}
