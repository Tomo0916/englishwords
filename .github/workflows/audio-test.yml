name: Audio test

# 手動実行専用：同じ単語をいくつかの方法で音声化して聞き比べる（Supabase Storage の audio/test に保存）
on:
  workflow_dispatch:
    inputs:
      words:
        description: '比べる単語の番号（カンマ区切り）'
        required: false
        default: '2,10,12,61,68,200'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ffmpeg
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
      - name: Test
        run: node scripts/audio-test.mjs
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WORDS: ${{ inputs.words }}
